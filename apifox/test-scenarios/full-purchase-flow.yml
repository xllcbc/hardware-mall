name: "完整购买流程测试"
description: "端到端测试：用户登录->浏览商品->加入购物车->创建订单->取消订单"
baseUrl: "http://localhost:8080"

testCases:

  - name: "Step-1: 用户登录获取Token"
    request:
      method: POST
      url: "/api/user/login"
      headers:
        Content-Type: "application/json"
      body:
        code: "test_code_001"
    expect:
      statusCode: 200
      body:
        code: 200
        message: "success"
        data:
          token: "@isNotEmpty()"
    extract:
      userToken: "body.data.token"

  - name: "Step-2: 获取分类列表"
    request:
      method: GET
      url: "/api/user/category/list"
    expect:
      statusCode: 200
      body:
        code: 200
        data:
          "@isArray()"
          "@length(4)"
    extract:
      categoryId: "body.data.0.id"

  - name: "Step-3: 获取推荐商品列表"
    request:
      method: GET
      url: "/api/user/product/recommend"
    expect:
      statusCode: 200
      body:
        code: 200
        data:
          "@isArray()"
    extract:
      productId: "body.data.0.id"

  - name: "Step-4: 获取商品详情"
    request:
      method: GET
      url: "/api/user/product/{{productId}}"
    expect:
      statusCode: 200
      body:
        code: 200
        data:
          id: "{{productId}}"

  - name: "Step-5: 添加商品到购物车"
    request:
      method: POST
      url: "/api/user/cart/add"
      headers:
        Authorization: "Bearer {{userToken}}"
        Content-Type: "application/json"
      body:
        productId: "{{productId}}"
        quantity: 2
    expect:
      statusCode: 200
      body:
        code: 200
        message: "success"

  - name: "Step-6: 再添加一个商品到购物车"
    request:
      method: POST
      url: "/api/user/cart/add"
      headers:
        Authorization: "Bearer {{userToken}}"
        Content-Type: "application/json"
      body:
        productId: 2
        quantity: 1
    expect:
      statusCode: 200
      body:
        code: 200
        message: "success"

  - name: "Step-7: 查看购物车列表"
    request:
      method: GET
      url: "/api/user/cart/list"
      headers:
        Authorization: "Bearer {{userToken}}"
    expect:
      statusCode: 200
      body:
        code: 200
        data:
          "@isArray()"
          "@length(2)"

  - name: "Step-8: 修改购物车商品数量"
    request:
      method: PUT
      url: "/api/user/cart/1/quantity"
      headers:
        Authorization: "Bearer {{userToken}}"
        Content-Type: "application/json"
      body:
        quantity: 3
    expect:
      statusCode: 200
      body:
        code: 200
        message: "success"

  - name: "Step-9: 获取用户地址列表"
    request:
      method: GET
      url: "/api/user/address/list"
      headers:
        Authorization: "Bearer {{userToken}}"
    expect:
      statusCode: 200
      body:
        code: 200
        data:
          "@isArray()"
    extract:
      addressId: "body.data.0.id"

  - name: "Step-10: 获取物流列表"
    request:
      method: GET
      url: "/api/user/logistics/list"
    expect:
      statusCode: 200
      body:
        code: 200
        data:
          "@isArray()"
    extract:
      logisticsId: "body.data.0.id"

  - name: "Step-11: 创建订单"
    request:
      method: POST
      url: "/api/user/order/create"
      headers:
        Authorization: "Bearer {{userToken}}"
        Content-Type: "application/json"
      body:
        addressId: "{{addressId}}"
        logisticsId: "{{logisticsId}}"
        items:
          - productId: "{{productId}}"
            quantity: 3
        buyerRemark: "全流程自动化测试订单"
    expect:
      statusCode: 200
      body:
        code: 200
        message: "success"
        data:
          orderNo: "@isNotEmpty()"
          status: 1
    extract:
      orderId: "body.data.id"
      orderNo: "body.data.orderNo"

  - name: "Step-12: 查看订单列表"
    request:
      method: GET
      url: "/api/user/order/list"
      headers:
        Authorization: "Bearer {{userToken}}"
      query:
        page: 1
        limit: 10
    expect:
      statusCode: 200
      body:
        code: 200
        data:
          list:
            "@isArray()"
          total: "@isNumber()"

  - name: "Step-13: 查看订单详情"
    request:
      method: GET
      url: "/api/user/order/{{orderId}}"
      headers:
        Authorization: "Bearer {{userToken}}"
    expect:
      statusCode: 200
      body:
        code: 200
        data:
          id: "{{orderId}}"
          orderNo: "{{orderNo}}"
          status: 1
          items:
            "@isArray()"
            "@length(1)"

  - name: "Step-14: 取消订单"
    request:
      method: PUT
      url: "/api/user/order/{{orderId}}/cancel"
      headers:
        Authorization: "Bearer {{userToken}}"
        Content-Type: "application/json"
      body:
        reason: "全流程测试完成，取消订单"
    expect:
      statusCode: 200
      body:
        code: 200
        message: "success"

  - name: "Step-15: 验证订单已取消"
    request:
      method: GET
      url: "/api/user/order/{{orderId}}"
      headers:
        Authorization: "Bearer {{userToken}}"
    expect:
      statusCode: 200
      body:
        code: 200
        data:
          status: 5
          cancelReason: "@isNotEmpty()"

  - name: "Step-16: 清空购物车"
    request:
      method: DELETE
      url: "/api/user/cart/clear"
      headers:
        Authorization: "Bearer {{userToken}}"
    expect:
      statusCode: 200
      body:
        code: 200
        message: "success"

  - name: "Step-17: 验证购物车已清空"
    request:
      method: GET
      url: "/api/user/cart/list"
      headers:
        Authorization: "Bearer {{userToken}}"
    expect:
      statusCode: 200
      body:
        code: 200
        data:
          "@length(0)"
