name: hardware-mall-prod

services:
  backend:
    image: ${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/hardware-mall-backend:${IMAGE_TAG:-latest}
    container_name: hw-backend
    network_mode: host
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - /opt/hardware-mall/.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: localhost
      REDIS_HOST: localhost

  redis:
    image: crpi-gryw2txgea9uqhmk.cn-beijing.personal.cr.aliyuncs.com/hardware-mall/redis:7-alpine
    container_name: hw-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - hw-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  admin:
    image: ${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/hardware-mall-admin:${IMAGE_TAG:-latest}
    container_name: hw-admin
    restart: unless-stopped
    depends_on:
      - backend
    extra_hosts:
      - "backend:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/nginx/certs:/etc/nginx/certs:ro
      - /etc/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - /opt/hardware-mall/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - hw-net

networks:
  hw-net:
    driver: bridge

volumes:
  redis-data:
