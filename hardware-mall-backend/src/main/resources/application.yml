server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: hardware-mall
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hardware_mall}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASSWORD:}
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 3s
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
          database: 0
  task:
    execution:
      pool:
        core-size: 5
        max-size: 20
        queue-capacity: 100
        keep-alive: 60s

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.mystore.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD}

wechat:
  appid: ${WECHAT_APPID}
  secret: ${WECHAT_SECRET}
  pay:
    mch-id: ${WECHAT_MCH_ID:}
    api-v3-key: ${WECHAT_API_V3_KEY:}
    private-key: ${WECHAT_PRIVATE_KEY:}
    public-key: ${WECHAT_PUBLIC_KEY:}
    public-key-id: ${WECHAT_PUBLIC_KEY_ID:}
    mch-serial-no: ${WECHAT_MCH_SERIAL_NO:}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:}

aliyun:
  oss:
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: ${OSS_BUCKET_NAME}
    region: ${OSS_REGION:cn-beijing}
    domain: ${OSS_DOMAIN}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}

dingtalk:
  webhook: ${DINGTALK_WEBHOOK:}
  secret: ${DINGTALK_SECRET:}

logging:
  level:
    com.example.mystore: debug
