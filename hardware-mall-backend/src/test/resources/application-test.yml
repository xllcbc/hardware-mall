spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      schema-locations: classpath:db/schema-test.sql
      mode: always
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.example.mystore.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: test-secret-key-for-junit-testing-only
  expiration: 86400000

admin:
  username: admin
  password: admin123

wechat:
  appid: wx-test-appid-for-ci
  secret: test-secret-for-ci
  pay:
    mch-id: "false"

aliyun:
  oss:
    access-key-id: test-access-key
    access-key-secret: test-secret-key
    bucket-name: test-bucket
    region: cn-beijing
    domain: https://test-bucket.oss-cn-beijing.aliyuncs.com

cors:
  allowed-origins: http://localhost:*

dingtalk:
  webhook: ""
  secret: ""

logging:
  level:
    com.example.mystore: debug
    org.testcontainers: info
