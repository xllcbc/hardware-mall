name: deploy-uniapp-experience

on:
  workflow_run:
    workflows: [pricing-release-gate]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  upload-experience:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: wechat-experience
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: hardware-mall-uniapp/package-lock.json

      - name: Install deps
        working-directory: hardware-mall-uniapp
        run: npm ci

      - name: Build mp-weixin
        working-directory: hardware-mall-uniapp
        run: |
          VITE_API_BASE_URL=${{ secrets.UNIAPP_API_BASE_URL }} npm run build:mp-weixin

      - name: Write wechat private key
        run: |
          mkdir -p "$HOME/.wechat"
          echo "${{ secrets.WEAPP_PRIVATE_KEY_B64 }}" | base64 --decode > "$HOME/.wechat/private.${{ secrets.WEAPP_APPID }}.key"
          chmod 600 "$HOME/.wechat/private.${{ secrets.WEAPP_APPID }}.key"

      - name: Validate private key
        run: |
          KEY="$HOME/.wechat/private.${{ secrets.WEAPP_APPID }}.key"
          if openssl pkey -in "$KEY" -noout 2>/dev/null; then
            echo "private key ok"
          else
            echo "ERROR: private key invalid or unsupported format"
            exit 1
          fi

      - name: Upload to experience
        working-directory: hardware-mall-uniapp
        env:
          WEAPP_APPID: ${{ secrets.WEAPP_APPID }}
          CI_VERSION_DESC: pricing-release-${{ github.event.workflow_run.head_sha }}
        run: |
          export WEAPP_PRIVATE_KEY_PATH="$HOME/.wechat/private.${WEAPP_APPID}.key"
          ls -l "$WEAPP_PRIVATE_KEY_PATH"
          node scripts/build-uni.js
