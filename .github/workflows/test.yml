name: test-and-build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'phase*']

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hardware_mall_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Run tests
        working-directory: hardware-mall-backend
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: hardware_mall_test
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_SECRET: ${{ secrets.JWT_SECRET_FOR_TEST || 'ci_test_jwt_secret_32_bytes_long' }}
          ADMIN_PASSWORD: TestStrongPwd_2026
        run: mvn -B clean test

  admin-build:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: hardware-mall-admin/package-lock.json
      - name: Build admin
        working-directory: hardware-mall-admin
        run: |
          npm ci
          npm run build

  uniapp-build:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: hardware-mall-uniapp/package-lock.json
      - name: Build uniapp mp-weixin
        working-directory: hardware-mall-uniapp
        run: |
          npm ci
          npm run build:mp-weixin
