name: deploy-prod

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target (staging|prod)'
        required: true
        default: 'prod'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      DOCKER_NAMESPACE: ${{ secrets.DOCKER_NAMESPACE }}
      IMAGE_BACKEND: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_NAMESPACE }}/hardware-mall-backend:${{ github.sha }}
      IMAGE_ADMIN: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_NAMESPACE }}/hardware-mall-admin:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./hardware-mall-backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_NAMESPACE }}/hardware-mall-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_NAMESPACE }}/hardware-mall-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_NAMESPACE }}/hardware-mall-backend:buildcache,mode=max

      - name: Build & push admin
        uses: docker/build-push-action@v5
        with:
          context: ./hardware-mall-admin
          push: true
          tags: |
            ${{ env.IMAGE_ADMIN }}
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_NAMESPACE }}/hardware-mall-admin:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_NAMESPACE }}/hardware-mall-admin:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_NAMESPACE }}/hardware-mall-admin:buildcache,mode=max

      - name: SSH deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ secrets.DOCKER_REGISTRY }} -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            cd /opt/hardware-mall
            git fetch --all
            git checkout ${{ github.sha }} -- docker-compose.prod.yml
            export IMAGE_TAG=${{ github.sha }}
            export DOCKER_REGISTRY=${{ secrets.DOCKER_REGISTRY }}
            export DOCKER_NAMESPACE=${{ secrets.DOCKER_NAMESPACE }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            sleep 60
            docker compose ps
            curl -sf http://localhost:8080/actuator/health
